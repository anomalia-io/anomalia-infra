---
- name: Descargar, instalar y actualizar el stack completo de Anomalia
  hosts: all
  become: yes
  vars:
    # spec 016: el directorio temporal se genera por corrida (ver primer task)
    # para que dos ejecuciones concurrentes no compartan archivos y una no borre
    # el directorio de la otra. El valor previo compartido causaba el fallo
    # "Source /tmp/anomalia-binaries/vmalert-prod not found".
    # Flag para controlar si se gestionan (enable/restart) los servicios de systemd. 
    # Por defecto está en false, se activa pasando: -e "gestionar_servicios=true"
    gestionar_servicios: false
    nombre_usuario: "anomalia"

    victorialogs_version: "v1.54.0"
    victoriametrics_version: "v1.157.0"
    victoriatraces_version: "v0.13.0"
    pyroscope_version: "v2.4.4"
    parses_version: "latest"
    alertmanager_version: "v0.35.1"

  tasks:
    - name: Definir directorio temporal unico de esta corrida
      ansible.builtin.set_fact:
        # lookup('password', '/dev/null ...') genera un valor aleatorio sin tocar
        # disco; al ser set_fact se evalua una sola vez y queda fijo para la corrida.
        tmp_dir: >-
          {{ (ansible_env.TMPDIR | default('/tmp')) }}/anomalia-binaries-{{ lookup('password', '/dev/null length=12 chars=hexdigits') }}

    - name: Crear directorio temporal de descarga
      file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: '0755'

    - name: Determinar arquitectura de binarios soportada
      ansible.builtin.set_fact:
        anomalia_bin_arch: >-
          {{ 'amd64' if (ansible_architecture | lower == 'x86_64')
             else 'arm64' if ('aarch64' in (ansible_architecture | lower))
             else 'unsupported' }}

    - name: Abortar si la arquitectura no está soportada
      ansible.builtin.fail:
        msg: >-
          Arquitectura '{{ ansible_architecture }}' no soportada. Anomalia
          publica binarios solo para x86_64 (amd64) y aarch64 (arm64).
      when: anomalia_bin_arch == 'unsupported'

    # ==========================================
    # 1. VICTORIALOGS (vlstorage, vlinsert, vlselect)
    # ==========================================
    - block:
        - name: Resolver URL de descarga para VictoriaLogs
          ansible.builtin.set_fact:
            vlogs_download_url: "https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/{{ victorialogs_version }}/victoria-logs-linux-{{ anomalia_bin_arch }}-{{ victorialogs_version }}.tar.gz"

        - name: Descargar tarball de VictoriaLogs
          get_url:
            url: "{{ vlogs_download_url }}"
            dest: "{{ tmp_dir }}/victorialogs.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer binarios de VictoriaLogs
          unarchive:
            src: "{{ tmp_dir }}/victorialogs.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Copiar binarios de VictoriaLogs a /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/victoria-logs-prod"
            dest: "/usr/local/bin/{{ item.name }}"
            mode: '0755'
            remote_src: yes
          loop:
            - { name: 'vlstorage', group: 'vlogs_storage_nodes' }
            - { name: 'vlinsert', group: 'vlogs_insert_nodes' }
            - { name: 'vlselect', group: 'vlogs_select_nodes' }
          when: >
            (inventory_hostname in groups.get(item.group, [])) or
            (servicio is defined and servicio == item.name)

        - name: Habilitar y reiniciar servicios systemd de VictoriaLogs
          systemd:
            name: "anomalia-{{ item.name }}.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          loop:
            - { name: 'vlstorage', group: 'vlogs_storage_nodes' }
            - { name: 'vlinsert', group: 'vlogs_insert_nodes' }
            - { name: 'vlselect', group: 'vlogs_select_nodes' }
          when:
            - gestionar_servicios | bool
            - >
              (inventory_hostname in groups.get(item.group, [])) or
              (servicio is defined and servicio == item.name)
      when: >
        inventory_hostname in groups.get('vlogs_storage_nodes', []) or
        inventory_hostname in groups.get('vlogs_insert_nodes', []) or
        inventory_hostname in groups.get('vlogs_select_nodes', []) or
        (servicio is defined and servicio in ['vlstorage', 'vlinsert', 'vlselect'])

    # ==========================================
    # 2. VICTORIAMETRICS CLUSTER (vmstorage, vminsert, vmselect)
    # ==========================================
    - block:
        - name: Resolver URL de descarga para VictoriaMetrics Cluster
          ansible.builtin.set_fact:
            vmcluster_download_url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/{{ victoriametrics_version }}/victoria-metrics-linux-{{ anomalia_bin_arch }}-{{ victoriametrics_version }}-cluster.tar.gz"

        - name: Descargar tarball de VictoriaMetrics Cluster
          get_url:
            url: "{{ vmcluster_download_url }}"
            dest: "{{ tmp_dir }}/vmcluster.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer binarios de VictoriaMetrics Cluster
          unarchive:
            src: "{{ tmp_dir }}/vmcluster.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Copiar binarios del Cluster de VictoriaMetrics a /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/{{ item.src }}"
            dest: "/usr/local/bin/{{ item.dest }}"
            mode: '0755'
            remote_src: yes
          loop:
            - { src: 'vmstorage-prod', dest: 'vmstorage', group: 'vm_storage_nodes' }
            - { src: 'vminsert-prod', dest: 'vminsert', group: 'vm_insert_nodes' }
            - { src: 'vmselect-prod', dest: 'vmselect', group: 'vm_select_nodes' }
          when: >
            (inventory_hostname in groups.get(item.group, [])) or
            (servicio is defined and servicio == item.dest)

        - name: Habilitar y reiniciar servicios systemd de VictoriaMetrics
          systemd:
            name: "anomalia-{{ item.dest }}.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          loop:
            - { dest: 'vmstorage', group: 'vm_storage_nodes' }
            - { dest: 'vminsert', group: 'vm_insert_nodes' }
            - { dest: 'vmselect', group: 'vm_select_nodes' }
          when:
            - gestionar_servicios | bool
            - >
              (inventory_hostname in groups.get(item.group, [])) or
              (servicio is defined and servicio == item.dest)
      when: >
        inventory_hostname in groups.get('vm_storage_nodes', []) or
        inventory_hostname in groups.get('vm_insert_nodes', []) or
        inventory_hostname in groups.get('vm_select_nodes', []) or
        (servicio is defined and servicio in ['vmstorage', 'vminsert', 'vmselect'])

    # ==========================================
    # 3. VICTORIATRACES (vtstorage, vtinsert, vtselect)
    # ==========================================
    - block:
        - name: Resolver URL de descarga para VictoriaTraces
          ansible.builtin.set_fact:
            vtcluster_download_url: "https://github.com/VictoriaMetrics/VictoriaTraces/releases/download/{{ victoriatraces_version }}/victoria-traces-linux-{{ anomalia_bin_arch }}-{{ victoriatraces_version }}.tar.gz"

        - name: Descargar tarball de VictoriaTraces
          get_url:
            url: "{{ vtcluster_download_url }}"
            dest: "{{ tmp_dir }}/vtcluster.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer binarios de VictoriaTraces
          unarchive:
            src: "{{ tmp_dir }}/vtcluster.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Copiar binarios de VictoriaTraces a /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/victoria-traces-prod"
            dest: "/usr/local/bin/{{ item.name }}"
            mode: '0755'
            remote_src: yes
          loop:
            - { name: 'vtstorage', group: 'vt_storage_nodes' }
            - { name: 'vtinsert', group: 'vt_insert_nodes' }
            - { name: 'vtselect', group: 'vt_select_nodes' }
          when: >
            (inventory_hostname in groups.get(item.group, [])) or
            (servicio is defined and servicio == item.name)

        - name: Habilitar y reiniciar servicios systemd de VictoriaTraces
          systemd:
            name: "anomalia-{{ item.name }}.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          loop:
            - { name: 'vtstorage', group: 'vt_storage_nodes' }
            - { name: 'vtinsert', group: 'vt_insert_nodes' }
            - { name: 'vtselect', group: 'vt_select_nodes' }
          when:
            - gestionar_servicios | bool
            - >
              (inventory_hostname in groups.get(item.group, [])) or
              (servicio is defined and servicio == item.name)
      when: >
        inventory_hostname in groups.get('vt_storage_nodes', []) or
        inventory_hostname in groups.get('vt_insert_nodes', []) or
        inventory_hostname in groups.get('vt_select_nodes', []) or
        (servicio is defined and servicio in ['vtstorage', 'vtinsert', 'vtselect'])

    # ==========================================
    # 4. VMUTILS (vmagent, vmauth, vmalert)
    # ==========================================
    - block:
        - name: Resolver URL de descarga para vmutils
          ansible.builtin.set_fact:
            vmutils_download_url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/{{ victoriametrics_version }}/vmutils-linux-{{ anomalia_bin_arch }}-{{ victoriametrics_version }}.tar.gz"

        - name: Descargar tarball de vmutils
          get_url:
            url: "{{ vmutils_download_url }}"
            dest: "{{ tmp_dir }}/vmutils.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer binarios de vmutils
          unarchive:
            src: "{{ tmp_dir }}/vmutils.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Copiar binarios de vmutils a /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/{{ item.src }}"
            dest: "/usr/local/bin/{{ item.dest }}"
            mode: '0755'
            remote_src: yes
          loop:
            - { src: 'vmagent-prod', dest: 'vmagent', group: 'vmagent_nodes' }
            - { src: 'vmauth-prod', dest: 'vmauth', group: 'vmauth_nodes' }
            - { src: 'vmalert-prod', dest: 'vmalert', group: 'vmalert_nodes' }
          when: >
            (inventory_hostname in groups.get(item.group, [])) or
            (servicio is defined and servicio == item.dest)

        - name: Descubrir unidades vmalert por tenant en el nodo
          ansible.builtin.find:
            paths: /etc/systemd/system
            patterns: "anomalia-vmalert-*.service"
          register: vmalert_pt_units_update
          changed_when: false
          when: servicio is defined and servicio == 'vmalert'

        - name: Habilitar y reiniciar servicios systemd de vmutils
          systemd:
            name: "anomalia-{{ item.dest }}.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          loop:
            - { dest: 'vmagent', group: 'vmagent_nodes' }
            - { dest: 'vmauth', group: 'vmauth_nodes' }
            - { dest: 'vmalert', group: 'vmalert_nodes' }
          when:
            - gestionar_servicios | bool
            - >
              (inventory_hostname in groups.get(item.group, [])) or
              (servicio is defined and servicio == item.dest)
            # En modo por-tenant la unit single no se toca (la gestiona el rol vmalert).
            - not (item.dest == 'vmalert' and vmalert_instances is defined and vmalert_instances | length > 0)
            - not (item.dest == 'vmalert' and (vmalert_pt_units_update.files | default([])) | length > 0)

        - name: Reiniciar unidades vmalert por tenant al actualizar el binario
          ansible.builtin.systemd:
            name: "{{ item.path | basename }}"
            enabled: yes
            state: restarted
            daemon_reload: yes
          loop: "{{ vmalert_pt_units_update.files | default([]) }}"
          loop_control:
            label: "{{ item.path | basename }}"
          when:
            - servicio is defined and servicio == 'vmalert'
            - gestionar_servicios | bool
            - (vmalert_pt_units_update.files | default([])) | length > 0
      when: >
        inventory_hostname in groups.get('vmagent_nodes', []) or
        inventory_hostname in groups.get('vmauth_nodes', []) or
        inventory_hostname in groups.get('vmalert_nodes', []) or
        (servicio is defined and servicio in ['vmagent', 'vmauth', 'vmalert'])

    # ==========================================
    # 4b. vmalert POR TENANT (dual-mode, specs 011/012)
    # ==========================================
    # Se despliega SOLO en hosts del grupo vmalert_nodes (topología flexible,
    # spec 013). Excepción: el worker del backend corre este play ad-hoc con
    # `-i <ip>,` (grupos vacíos, `groups['all'] | length == 1`) por lo que ese
    # caso se admite igualmente para mantener el aprovisionamiento programático.
    - name: Desplegar unidades vmalert por tenant
      ansible.builtin.include_role:
        name: vmalert
      when: >
        vmalert_instances is defined and vmalert_instances | length > 0 and
        (inventory_hostname in groups.get('vmalert_nodes', []) or
         groups.get('all', []) | length == 1)

    # ==========================================
    # 5. PYROSCOPE
    # ==========================================
    - block:
        - name: Resolver URL de descarga para Pyroscope
          ansible.builtin.set_fact:
            pyroscope_download_url: "https://github.com/grafana/pyroscope/releases/download/{{ pyroscope_version }}/pyroscope_{{ pyroscope_version | regex_replace('^v', '') }}_linux_{{ anomalia_bin_arch }}.tar.gz"

        - name: Descargar tarball de Pyroscope
          get_url:
            url: "{{ pyroscope_download_url }}"
            dest: "{{ tmp_dir }}/pyroscope.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer Pyroscope
          unarchive:
            src: "{{ tmp_dir }}/pyroscope.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Instalar binario de Pyroscope en /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/pyroscope"
            dest: "/usr/local/bin/pyroscope"
            mode: '0755'
            remote_src: yes

        - name: Habilitar y reiniciar servicio systemd de Pyroscope
          systemd:
            name: "anomalia-pyroscope.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          when: gestionar_servicios | bool
      when: >
        inventory_hostname in groups.get('pyroscope_nodes', []) or
        (servicio is defined and servicio == 'pyroscope')

    # ==========================================
    # 6. ALERTMANAGER
    # ==========================================
    - block:
        - name: Resolver URL de descarga para Alertmanager
          ansible.builtin.set_fact:
            alertmanager_download_url: "https://github.com/prometheus/alertmanager/releases/download/{{ alertmanager_version }}/alertmanager-{{ alertmanager_version | regex_replace('^v', '') }}.linux-{{ anomalia_bin_arch }}.tar.gz"
            alertmanager_folder_name: "alertmanager-{{ alertmanager_version | regex_replace('^v', '') }}.linux-{{ anomalia_bin_arch }}"

        - name: Descargar tarball de Alertmanager
          get_url:
            url: "{{ alertmanager_download_url }}"
            dest: "{{ tmp_dir }}/alertmanager.tar.gz"
            timeout: 180
          retries: 3
          delay: 5

        - name: Extraer Alertmanager
          unarchive:
            src: "{{ tmp_dir }}/alertmanager.tar.gz"
            dest: "{{ tmp_dir }}"
            remote_src: yes

        - name: Instalar binario de Alertmanager en /usr/local/bin
          copy:
            src: "{{ tmp_dir }}/{{ alertmanager_folder_name }}/alertmanager"
            dest: "/usr/local/bin/alertmanager"
            mode: '0755'
            remote_src: yes

        - name: Habilitar y reiniciar servicio systemd de Alertmanager
          systemd:
            name: "anomalia-alertmanager.service"
            enabled: yes
            state: restarted
            daemon_reload: yes
          when: gestionar_servicios | bool
      when: >
        inventory_hostname in groups.get('alertmanager_nodes', []) or
        (servicio is defined and servicio == 'alertmanager')

    # ==========================================
    # LIMPIEZA FINAL
    # ==========================================
    - name: Limpiar archivos temporales de descarga
      file:
        path: "{{ tmp_dir }}"
        state: absent
