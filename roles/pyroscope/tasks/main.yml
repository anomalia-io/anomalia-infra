---
- name: Crear directorios de datos para Pyroscope con propiedad de anomalia
  ansible.builtin.file:
    path: "{{ pyroscope_storage_path }}"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'

- name: Copiar servicio systemd para Pyroscope
  ansible.builtin.template:
    src: pyroscope.service.j2
    dest: /etc/systemd/system/anomalia-pyroscope.service
    mode: '0644'
  notify: Recargar systemd y reiniciar pyroscope

# Idempotencia (spec 013): asegurar el arranque aunque la unidad quedara en
# `inactive/failed` y el template no cambie (mata el bug de handlers).
- name: Asegurar pyroscope habilitado y arrancado
  ansible.builtin.systemd:
    name: anomalia-pyroscope.service
    state: started
    enabled: yes
    daemon_reload: yes
