---
- name: Crear directorios de almacenamiento para Anomalia Logs con propiedad de anomalia
  ansible.builtin.file:
    path: "{{ vlstorage_path }}"
    state: directory
    owner: "{{ nombre_usuario }}"
    group: "{{ nombre_usuario }}"
    mode: '0755'
  when: inventory_hostname in groups.get('vlogs_storage_nodes', [])

- name: Copiar servicio systemd de anomalia vlstorage
  ansible.builtin.template:
    src: vlstorage.service.j2
    dest: /etc/systemd/system/anomalia-vlstorage.service
    mode: '0644'
  notify: Recargar systemd y reiniciar vlstorage
  when: inventory_hostname in groups.get('vlogs_storage_nodes', [])

- name: Copiar servicio systemd de anomalia vlinsert
  ansible.builtin.template:
    src: vlinsert.service.j2
    dest: /etc/systemd/system/anomalia-vlinsert.service
    mode: '0644'
  notify: Recargar systemd y reiniciar vlinsert
  when: inventory_hostname in groups.get('vlogs_insert_nodes', [])

- name: Copiar servicio systemd de anomalia vlselect
  ansible.builtin.template:
    src: vlselect.service.j2
    dest: /etc/systemd/system/anomalia-vlselect.service
    mode: '0644'
  notify: Recargar systemd y reiniciar vlselect
  when: inventory_hostname in groups.get('vlogs_select_nodes', [])

# Idempotencia (spec 013): asegurar el arranque aunque la unidad quedara en
# `inactive/failed` y el template no cambie (mata el bug de handlers).
- name: Asegurar vlstorage habilitado y arrancado
  ansible.builtin.systemd:
    name: anomalia-vlstorage.service
    state: started
    enabled: yes
    daemon_reload: yes
  when: inventory_hostname in groups.get('vlogs_storage_nodes', [])

- name: Asegurar vlinsert habilitado y arrancado
  ansible.builtin.systemd:
    name: anomalia-vlinsert.service
    state: started
    enabled: yes
    daemon_reload: yes
  when: inventory_hostname in groups.get('vlogs_insert_nodes', [])

- name: Asegurar vlselect habilitado y arrancado
  ansible.builtin.systemd:
    name: anomalia-vlselect.service
    state: started
    enabled: yes
    daemon_reload: yes
  when: inventory_hostname in groups.get('vlogs_select_nodes', [])
