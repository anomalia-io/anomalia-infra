# =====================================================================
# Configuración de Endpoints para vmauth
# =====================================================================

# Fuente del backend:
#   1. Si existe un checkout hermano (../anomalia-backend), se usa ese.
#   2. Si no, se clona el backend público en su última release publicada.
# Se puede sobreescribir con -e anomalia_backend_src=/ruta.
anomalia_backend_src: "{{ playbook_dir }}/../anomalia-backend"

# Repositorio público del backend y ref a clonar cuando no hay checkout local.
# anomalia_backend_ref vacío => se resuelve la última release publicada (tag vX.Y.Z).
# Alternativas: "main" o un tag concreto ("v1.0.0").
anomalia_backend_repo: "https://github.com/anomalia-io/anomalia-backend.git"
anomalia_backend_ref: ""
anomalia_backend_clone_dir: "/tmp/anomalia-backend"

# 1. Obtenemos el nodo, puerto e IP específica definida en el inventario para vmauth
backend_vmauth_node: "{{ groups.get('vmauth_nodes', []) | first | default('') }}"
backend_vmauth_ip: "{{ '127.0.0.1' if not backend_vmauth_node else hostvars[backend_vmauth_node].vmauth_ip | default(hostvars[backend_vmauth_node].ansible_host | default('127.0.0.1')) }}"
backend_vmauth_port: "{{ '8427' if not backend_vmauth_node else hostvars[backend_vmauth_node].vmauth_port | default(hostvars[backend_vmauth_node].vmauth_server_port | default('8427')) }}"

# 2. Asignación directa a la IP real de escucha (ej. 192.168.1.27) 
backend_vmauth_base_url: "http://{{ backend_vmauth_ip }}:{{ backend_vmauth_port }}"

# 3. Endpoints finales que consumirá el backend
backend_pyroscope_address: "{{ backend_vmauth_base_url }}"
backend_otel_traces_endpoint: "{{ backend_vmauth_base_url }}/insert/opentelemetry/v1/traces?tenant=TRACES"
backend_otel_metrics_endpoint: "{{ backend_vmauth_base_url }}/insert/opentelemetry/v1/metrics?tenant=METRICS"
backend_audit_logs_endpoint: "{{ backend_vmauth_base_url }}/insert/loki/api/v1/push?tenant=AUDIT_LOGS"

# =====================================================================
# Parses (spec 008): DNS del bridge si comparten host; IP:puerto si no.
# =====================================================================
parses_node: "{{ groups.get('parses_nodes', []) | first | default('') }}"
parses_peer_is_local: "{{ not parses_node or parses_node == inventory_hostname }}"
parses_peer_ip: "{{ '' if not parses_node else (hostvars[parses_node].parses_ip | default(hostvars[parses_node].ansible_host | default('127.0.0.1'))) }}"
parses_peer_port: "{{ hostvars[parses_node].parses_port | default(8090) if parses_node else 8090 }}"
backend_parses_base_url: "{{ 'http://parses:8080' if (parses_peer_is_local | bool) else ('http://' ~ parses_peer_ip ~ ':' ~ (parses_peer_port | string)) }}"
backend_parses_proxy_base: "https://anomalia_gw_tls:8443/api/v1/parses/datasources"

# =====================================================================
# Gateway TLS
# =====================================================================
# Nginx termina TLS en 80/443 y expone TLS interno a Parses en 8443.
anomalia_nginx_image: "nginx:1.27-alpine"
anomalia_nginx_client_max_body_size: "512m"
anomalia_gw_upstream: "anomalia_gw"
anomalia_gw_upstream_port: "{{ backend_port | default(backend_http_port | default(8000)) }}"

# =====================================================================
# Modelo de Ollama por defecto (spec 003)
# Debe incluir el tag (ej. "llama3.2:1b"). El role lo descarga con
# "ollama pull" tras levantar el stack si aún no está en el volumen.
# =====================================================================
ollama_model: "llama3.2:1b"
ai_timeout_seconds: 120
ollama_num_predict: 384

# Redeploy: por defecto se conservan postgres_data y ollama_data.
# --reset-data/inventory puede activar la destrucción explícita de volúmenes.
anomalia_compose_destroy_volumes: false
anomalia_assume_yes: false
