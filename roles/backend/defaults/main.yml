# =====================================================================
# Configuración de Endpoints para vmauth
# =====================================================================

# Fuente del backend: el repo anomalia-backend se clona hermanado a este repo
# (anomalia-infra). Se puede sobreescribir con -e anomalia_backend_src=/ruta.
anomalia_backend_src: "{{ playbook_dir }}/../anomalia-backend"

# 1. Obtenemos el nodo, puerto e IP específica definida en el inventario para vmauth
backend_vmauth_node: "{{ groups.get('vmauth_nodes', []) | first | default('') }}"
backend_vmauth_ip: "{{ '127.0.0.1' if not backend_vmauth_node else hostvars[backend_vmauth_node].vmauth_ip | default('127.0.0.1') }}"
backend_vmauth_port: "{{ '8427' if not backend_vmauth_node else hostvars[backend_vmauth_node].vmauth_port | default('8427') }}"

# 2. Asignación directa a la IP real de escucha (ej. 192.168.1.27) 
backend_vmauth_base_url: "http://{{ backend_vmauth_ip }}:{{ backend_vmauth_port }}"

# 3. Endpoints finales que consumirá el backend
backend_pyroscope_address: "{{ backend_vmauth_base_url }}"
backend_otel_traces_endpoint: "{{ backend_vmauth_base_url }}/insert/opentelemetry/v1/traces?tenant=TRACES"
backend_otel_metrics_endpoint: "{{ backend_vmauth_base_url }}/insert/opentelemetry/v1/metrics?tenant=METRICS"
backend_audit_logs_endpoint: "{{ backend_vmauth_base_url }}/insert/loki/api/v1/push?tenant=AUDIT_LOGS"

# =====================================================================
# Modelo de Ollama por defecto (spec 003)
# Debe incluir el tag (ej. "llama3.2:1b"). El role lo descarga con
# "ollama pull" tras levantar el stack si aún no está en el volumen.
# =====================================================================
ollama_model: "llama3.2:1b"
