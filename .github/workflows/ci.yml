name: CI
on:
  push:
    branches: [main]
  pull_request
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ansible
        run: pip install ansible
      - name: Syntax check (deploy)
        run: ansible-playbook -i inventory.ini deploy-infra.yml --syntax-check
      - name: Syntax check (destroy)
        run: ansible-playbook -i inventory.ini destroy-infra.yml --syntax-check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
