name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ansible
        run: pip install ansible
      - name: Syntax check (deploy)
        run: ansible-playbook -i inventory.ini deploy-infra.yml --syntax-check
      - name: Syntax check (destroy)
        run: ansible-playbook -i inventory.ini destroy-infra.yml --syntax-check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          sha256sum -c --ignore-missing gitleaks_${GITLEAKS_VERSION}_checksums.txt
          tar xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan
        run: gitleaks dir . --no-banner
